[project]
name = "datorium-client"
version = "0.1.0"
description = "Pure Python smart client for DatoriumDB"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "John Dupuy" }]
keywords = ["datorium", "datoriumdb", "client", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/JohnAD/datorium-client-py"
Documentation = "https://github.com/JohnAD/datorium-client-py/tree/main/docs"
Repository = "https://github.com/JohnAD/datorium-client-py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/testdata",
    "/docs",
    "/tech-docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501", "SIM102", "SIM105", "SIM108", "SIM110"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
mypy_path = "src"
packages = ["datorium_client"]
# Internal JSON model uses recursive unions; keep app-facing modules strict.
[[tool.mypy.overrides]]
module = [
    "datorium_client._json.*",
    "datorium_client._schema.*",
    "datorium_client._patch.*",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "contract: Contract / golden fixture tests",
    "integration: Docker-backed integration tests",
]
addopts = ["-v", "--strict-markers", "--tb=short"]
